name: Native desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop-gpui/**
      - packages/protocol/**
      - .github/workflows/desktop-native.yml
  push:
    paths:
      - apps/desktop-gpui/**
      - packages/protocol/**
      - .github/workflows/desktop-native.yml

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
      - name: TypeScript protocol contract
        if: runner.os == 'Linux'
        run: |
          npm ci --ignore-scripts
          npm run typecheck -w @cca/protocol
          node --import tsx packages/protocol/src/desktopFixtures.ts --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libegl1-mesa-dev libvulkan-dev
      - name: Format
        run: cargo fmt --manifest-path apps/desktop-gpui/Cargo.toml --check
      - name: Protocol and network tests
        run: cargo test --manifest-path apps/desktop-gpui/Cargo.toml --locked --no-default-features
      - name: Native interface
        run: cargo check --manifest-path apps/desktop-gpui/Cargo.toml --locked
