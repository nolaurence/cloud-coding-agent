name: Release Desktop

# 手动触发，或推送 v* tag 时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # 未配置签名证书时，避免 electron-builder 去钥匙串里找 identity 而卡住
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (.deb / .rpm)
    runs-on: ${{ matrix.runner }}
    # deb/rpm 用 xz 压缩 1.5GB 的应用目录，比较吃 CPU；低配 runner 上留足余量
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rpm 目标需要 rpmbuild；deb 目标需要 fakeroot 设定包内文件属主
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # deb/rpm 必须有 homepage 和带 email 的 author，否则 electron-builder 直接报错
      - name: Inject package metadata
        run: |
          npm pkg set "description=Kloud Work - desktop client for cloud-coding-agent"
          npm pkg set "homepage=https://github.com/${{ github.repository }}"
          npm pkg set "author.name=nolaurence"
          npm pkg set "author.email=nolaurence@users.noreply.github.com"
          npm pkg set "build.linux.synopsis=Desktop client for cloud-coding-agent"

      - name: Build app bundles
        run: npm run build

      - name: Package deb + rpm
        run: npx electron-builder --linux deb rpm --${{ matrix.arch }} --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} (.dmg / .zip)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel 是 x64，macos-15 是 arm64（macos-14 已弃用）
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Inject package metadata
        run: |
          npm pkg set "description=Kloud Work - desktop client for cloud-coding-agent"
          npm pkg set "homepage=https://github.com/${{ github.repository }}"
          npm pkg set "author.name=nolaurence"
          npm pkg set "author.email=nolaurence@users.noreply.github.com"

      - name: Build app bundles
        run: npm run build

      - name: Package dmg + zip
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Inject package metadata
        run: |
          npm pkg set "description=Kloud Work - desktop client for cloud-coding-agent"
          npm pkg set "homepage=https://github.com/${{ github.repository }}"
          npm pkg set "author.name=nolaurence"
          npm pkg set "author.email=nolaurence@users.noreply.github.com"

      - name: Build app bundles
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
