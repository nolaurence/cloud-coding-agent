services:
  agent:
    build: .
    ports:
      - "${APP_PORT:-8787}:8787"
    volumes:
      - agent-data:/data
      # 挂载你的代码目录,供 Agent 操作
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    environment:
      - PORT=8787
      # 生产环境仅连接外部 MySQL
      - DATABASE_URL=${DATABASE_URL:?请在 .env 中配置外部 MySQL 连接串}
      # 管理员账户(首次启动时创建);其他用户通过注册页面创建,均为普通用户
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 中配置管理员密码}
    restart: unless-stopped

volumes:
  agent-data:
