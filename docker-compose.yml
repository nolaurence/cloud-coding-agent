services:
  db:
    image: mysql:8.4
    environment:
      - MYSQL_USER=${MYSQL_USER:-cca}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cca}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cca}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-cca-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute=\"SELECT 1\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agent:
    build: .
    ports:
      - "${APP_PORT:-8787}:8787"
    volumes:
      - agent-data:/data
      # 挂载你的代码目录,供 Agent 操作
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    environment:
      - PORT=8787
      # MySQL 连接串;指向 compose 内的 db 服务
      - DATABASE_URL=mysql://${MYSQL_USER:-cca}:${MYSQL_PASSWORD:-cca}@db:3306/${MYSQL_DATABASE:-cca}
      # 管理员账户(首次启动时创建);其他用户通过注册页面创建,均为普通用户
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-data:
  mysql-data:
